services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crytto
      POSTGRES_PASSWORD: crytto
      POSTGRES_DB: crytto
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crytto -d crytto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Emulador do Google Cloud Storage (mesma API do GCS) para a demonstração offline.
  # Em produção o backend usa o bucket real e este serviço não é necessário.
  gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-external-url", "http://localhost:4443"]
    volumes:
      - gcs_data:/storage
    ports:
      - "4443:4443"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gcs:
        condition: service_started
    environment:
      PORT: 3001
      DATABASE_URL: postgres://crytto:crytto@db:5432/crytto
      PGSSL: "false"
      GCS_BUCKET_NAME: crytto-rpg-avatars
      GCS_EMULATOR_HOST: http://gcs:4443
      GCS_PUBLIC_BASE_URL: http://localhost:4443
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      args:
        # Deixamos vazio: no docker-compose o front fala com o back via proxy /api do nginx.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  gcs_data:
