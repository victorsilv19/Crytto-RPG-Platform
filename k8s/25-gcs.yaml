# Emulador do Google Cloud Storage (mesma API do GCS) para os avatares.
#
# Nota para o frontend (nginx): o backend devolve URLs relativas no formato
#   /storage/<bucket>/<objeto>
# (GCS_PUBLIC_BASE_URL=/storage no ConfigMap). O nginx deve encaminhar esse caminho
# para este Service mantendo o Host igual ao -public-host abaixo, por exemplo:
#
#   location /storage/ {
#       proxy_pass http://gcs.crytto.svc.cluster.local:4443/;
#       proxy_set_header Host gcs:4443;
#   }
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gcs-data
  namespace: crytto
  labels:
    app: gcs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs
  namespace: crytto
  labels:
    app: gcs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gcs
  template:
    metadata:
      labels:
        app: gcs
    spec:
      containers:
        - name: gcs
          image: fsouza/fake-gcs-server:latest
          # Mesmos argumentos do docker-compose.yml, trocando localhost pelo nome do Service.
          args:
            - "-scheme"
            - "http"
            - "-port"
            - "4443"
            - "-public-host"
            - "gcs:4443"
            - "-external-url"
            - "http://gcs:4443"
          ports:
            - name: http
              containerPort: 4443
          volumeMounts:
            - name: data
              mountPath: /storage
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gcs-data
---
apiVersion: v1
kind: Service
metadata:
  name: gcs
  namespace: crytto
  labels:
    app: gcs
spec:
  type: ClusterIP
  selector:
    app: gcs
  ports:
    - name: http
      port: 4443
      targetPort: http
