server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe (Cloud Run/K8s).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Proxy da API (docker-compose). O nome é resolvido em runtime (variável + resolver),
    # então o nginx sobe normalmente mesmo sem o serviço "backend" (ex.: Cloud Run).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3001;
        client_max_body_size 6m;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
